<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Distribuidor de Líquido — DDL-01</title><style>
:root {
  --orange:#e87512;
  --orange-dark:#b95306;
  --orange-soft:#fff4e8;
  --navy:#17324d;
  --ink:#162231;
  --muted:#68798a;
  --line:#dce5ec;
  --bg:#eef2f5;
  --panel:#ffffff;
  --service:#1e63a9;
  --instrument:#18794e;
  --safety:#c83232;
  --general:#a66b14;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit}

.app{min-height:100vh;display:flex;flex-direction:column}

header{
  background:linear-gradient(100deg,var(--orange-dark),var(--orange));
  color:white;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  box-shadow:0 6px 20px rgba(67,35,10,.18);
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:clamp(22px,3vw,34px);font-weight:700;letter-spacing:.2px}
header .tag{font-size:clamp(16px,2vw,21px);font-weight:700;white-space:nowrap}

main{
  flex:1;
  width:min(1500px,100%);
  margin:0 auto;
  padding:18px;
}

.viewer{
  position:relative;
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 16px 38px rgba(22,34,49,.10);
}

.image-stage{position:relative;width:100%;background:#fff}
.image-stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.marker{
  position:absolute;
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.88);
  color:#fff;
  font-weight:700;
  display:grid;
  place-items:center;
  cursor:pointer;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 10px rgba(0,0,0,.18);
  transition:.16s ease;
  z-index:4;
  opacity:.72;
}
.marker:hover,.marker:focus-visible{
  transform:translate(-50%,-50%) scale(1.10);
  outline:none;
  opacity:.95;
  box-shadow:0 0 0 5px rgba(232,117,18,.12),0 5px 14px rgba(0,0,0,.20)
}
.marker.service{background:var(--service)}
.marker.instrument{background:var(--instrument)}
.marker.safety{background:var(--safety)}
.marker.general{background:var(--general)}

.component-box{
  position:absolute;
  border:3px solid var(--orange);
  border-radius:14px;
  background:rgba(232,117,18,.08);
  box-shadow:0 0 0 4px rgba(232,117,18,.12),0 8px 22px rgba(0,0,0,.10);
  pointer-events:none;
  opacity:0;
  transition:opacity .18s ease, transform .18s ease;
  z-index:2;
}
.component-box.show{opacity:1}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:7px 12px;
  padding:8px 10px;
  border-top:1px solid var(--line);
  background:#fbfcfd;
  color:#526273;
  font-size:10px;
}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

.backdrop{
  position:fixed;inset:0;background:rgba(7,18,30,.46);display:none;z-index:30
}
.backdrop.show{display:block}

.drawer{
  position:fixed;
  top:0;right:0;height:100%;
  width:min(480px,94vw);
  background:var(--panel);
  z-index:40;
  transform:translateX(103%);
  transition:transform .28s ease;
  box-shadow:-18px 0 50px rgba(7,18,30,.24);
  display:flex;
  flex-direction:column;
}
.drawer.show{transform:translateX(0)}

.drawer-head{
  background:linear-gradient(100deg,var(--orange-dark),var(--orange));
  color:#fff;
  padding:17px 18px;
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}
.drawer-head h2{margin:0;font-size:22px}
.drawer-head p{margin:4px 0 0;font-size:12px;opacity:.9}
.close{
  width:40px;height:40px;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.10);color:#fff;border-radius:10px;cursor:pointer;font-size:24px
}

.drawer-body{padding:18px;overflow:auto}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 9px;border-radius:999px;
  background:var(--orange-soft);color:#9a4f08;
  font-size:12px;font-weight:700;border:1px solid #f1c79f;margin-bottom:14px
}
.section{margin-bottom:18px}
.section h3{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#607284}
.grid{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:44% 56%;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.k,.v{padding:10px 11px;font-size:13px}
.k{background:#f8fafc;font-weight:700;color:#3a4c5e}
.v{background:#fff}
.note{margin-top:10px;padding:10px 11px;background:var(--orange-soft);border-left:4px solid var(--orange);border-radius:8px;color:#625241;font-size:12px}

@media (max-width:760px){
  header{padding:13px 14px}
  main{padding:10px}
  .marker{width:28px;height:28px;font-size:11px;border-width:2px;opacity:.70}
  .label{
  position:absolute;
  z-index:3;
  background:rgba(255,255,255,.92);
  color:var(--ink);
  border:1px solid #dbe4ec;
  border-radius:6px;
  padding:3px 6px;
  font-size:9px;
  line-height:1.15;
  font-weight:600;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  pointer-events:none;
  max-width:90px;
  white-space:normal;
}
  .row{grid-template-columns:1fr}
  .k{border-bottom:1px dashed var(--line)}
}

const componentBox = document.getElementById("componentBox");
const HIGHLIGHTS = {
  servico1:{left:"7%", top:"27%", width:"22%", height:"18%"},
  servico2:{left:"44%", top:"6%", width:"16%", height:"20%"},
  manometro:{left:"66%", top:"10%", width:"14%", height:"18%"},
  psv:{left:"80%", top:"9%", width:"16%", height:"22%"},
  servico3:{left:"5%", top:"70%", width:"25%", height:"22%"},
  servico4:{left:"57%", top:"66%", width:"24%", height:"23%"},
  equipamento:{left:"18%", top:"36%", width:"63%", height:"34%"}
};

function showHighlight(key){
  const h = HIGHLIGHTS[key];
  if(!h) return;
  componentBox.style.left = h.left;
  componentBox.style.top = h.top;
  componentBox.style.width = h.width;
  componentBox.style.height = h.height;
  componentBox.classList.add("show");
}

function hideHighlight(){
  componentBox.classList.remove("show");
}

const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("backdrop");
const title = document.getElementById("drawerTitle");
const subtitle = document.getElementById("drawerSubtitle");
const body = document.getElementById("drawerBody");
const closeBtn = document.getElementById("closeBtn");

function rowsHTML(rows) {
  return `<div class="grid">${rows.map(r => `
    <div class="row"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join("")}</div>`;
}

function openDrawer(key) {
  showHighlight(key);
  const item = DATA[key];
  if (!item) return;

  title.textContent = item.title;
  subtitle.textContent = item.subtitle || "Dados técnicos";

  body.innerHTML = `
    ${item.badge ? `<div class="badge">${item.badge}</div>` : ""}
    ${item.sections.map(s => `
      <section class="section"><h3>${s.title}</h3>
        ${rowsHTML(s.rows)}
        ${s.note ? `<div class="note">${s.note}</div>` : ""}
      </section>
    `).join("")}
  `;

  drawer.classList.add("show");
  backdrop.classList.add("show");
  drawer.setAttribute("aria-hidden","false");
}

function closeDrawer() {
  hideHighlight();
  drawer.classList.remove("show");
  backdrop.classList.remove("show");
  drawer.setAttribute("aria-hidden","true");
}

document.querySelectorAll(".marker").forEach(btn => {
  btn.addEventListener("click", () => openDrawer(btn.dataset.key));
});

closeBtn.addEventListener("click", closeDrawer);
backdrop.addEventListener("click", closeDrawer);

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
});
</script></body></html>
